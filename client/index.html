<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/app-icon_e26b6bab.png" />
    <link rel="apple-touch-icon" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/app-icon_e26b6bab.png" />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/app-icon_e26b6bab.png" />
    <meta property="og:title" content="Lifewoven — Personal Transformation Platform" />
    <meta property="og:description" content="Lifewoven is a personal transformation platform built on the 5S Framework. One intelligent operating system for your whole life." />
    <title>Lifewoven — Personal Transformation Platform</title>
    <meta name="description" content="Lifewoven is a personal transformation platform built on the 5S Framework. One intelligent operating system for your whole life." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2a2520" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lifewoven" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- Anti-FOUC: apply saved theme before React mounts -->
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})()</script>
    <!-- Splash screen: spins favicon, fades out when React mounts -->
    <div id="splash" style="
      position:fixed;inset:0;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      background:#ffffff;
      transition:opacity 0.8s ease, visibility 0.8s ease;
    ">
      <img
        src="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/app-icon_e26b6bab.png"
        alt="Lifewoven"
        id="splash-icon"
        style="width:120px;height:120px;border-radius:24px;animation:lw-spin 1.2s cubic-bezier(0.4,0,0.2,1) infinite;"
      />
    </div>
    <style>
      @keyframes lw-spin {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes lw-spinoff {
        0%   { transform: rotate(0deg) scale(1); opacity: 1; }
        60%  { transform: rotate(540deg) scale(1.18); opacity: 0.7; }
        100% { transform: rotate(900deg) scale(0); opacity: 0; }
      }
    </style>
    <script>
      // Dismiss splash once React has painted its first frame
      window.__dismissSplash = function() {
        var s = document.getElementById('splash');
        var icon = document.getElementById('splash-icon');
        if (!s) return;
        // Spin-off the icon first, then fade the backdrop
        if (icon) {
          icon.style.animation = 'lw-spinoff 0.7s cubic-bezier(0.4,0,0.6,1) forwards';
        }
        setTimeout(function() {
          s.style.opacity = '0';
          s.style.visibility = 'hidden';
          setTimeout(function(){ s.remove(); }, 850);
        }, 400);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
