<body>
    <script>(function(){try{var light=localStorage.getItem('theme')==='light';document.documentElement.style.setProperty('--splash-bg',light?'#F7F2E9':'#0B1020');}catch(e){}})()</script>
    <!-- Anti-FOUC: Lifewoven defaults to night; honor a stored light preference before React mounts. -->
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light')document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');}catch(e){}})()</script>
    <!-- Splash screen: spins favicon, fades out when React mounts -->
    <div id="splash" style="
      position:fixed;inset:0;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      background:var(--splash-bg,#f2ecdf);
      transition:opacity 0.8s ease, visibility 0.8s ease;
    ">
      <img
        src="/manus-storage/lifewoven-original-mark_811eea16.png"
        alt="Lifewoven"
        id="splash-icon"
        style="width:120px;height:120px;border-radius:24px;animation:lw-spin 1.2s cubic-bezier(0.4,0,0.2,1) infinite;"
      />
    </div>
    <style>
      @keyframes lw-spin {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes lw-spinoff {
        0%   { transform: rotate(0deg) scale(1); opacity: 1; }
        60%  { transform: rotate(540deg) scale(1.18); opacity: 0.7; }
        100% { transform: rotate(900deg) scale(0); opacity: 0; }
      }
    </style>
    <script>
      // Dismiss splash once React has painted its first frame
      window.__dismissSplash = function() {
        var s = document.getElementById('splash');
        var icon = document.getElementById('splash-icon');
        if (!s) return;
        // Spin-off the icon first, then fade the backdrop
        if (icon) {
          icon.style.animation = 'lw-spinoff 0.7s cubic-bezier(0.4,0,0.6,1) forwards';
        }
        setTimeout(function() {
          s.style.opacity = '0';
          s.style.visibility = 'hidden';
          setTimeout(function(){ s.remove(); }, 850);
        }, 400);
      };
      // A route must never remain hidden if a module or auth request stalls before
      // the app's first animation frame. The normal handler above still wins first.
      window.setTimeout(function() {
        var s = document.getElementById('splash');
        if (s) s.remove();
      }, 1600);
    </script>
    <div id="root"></div>
    <div id="pwa-startup-recovery" role="alert" aria-live="assertive" hidden style="position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;padding:24px;background:#0B1020;color:#F7F2E9;font-family:Inter,system-ui,sans-serif;text-align:center">
      <div style="max-width:360px">
        <img src="/manus-storage/lifewoven-original-mark_811eea16.png" alt="" width="56" height="56" style="border-radius:16px;margin:0 auto 24px" />
        <h1 style="font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;line-height:1.1;margin:0 0 12px">Lifewoven needs a refresh.</h1>
        <p style="color:#D1D5DB;line-height:1.55;margin:0 0 24px">A saved app update did not finish loading. Refreshing will safely load the latest version.</p>
        <button id="pwa-startup-refresh" type="button" style="min-height:48px;padding:12px 20px;border:0;border-radius:999px;background:#F59E0B;color:#111827;font:600 16px Inter,system-ui,sans-serif">Refresh Lifewoven</button>
      </div>
    </div>
    <script>
      (function () {
        var recovery = document.getElementById('pwa-startup-recovery');
        var retry = document.getElementById('pwa-startup-refresh');
        function showRecovery() {
          var root = document.getElementById('root');
          if (!recovery || (root && root.hasChildNodes())) return;
          var splash = document.getElementById('splash');
          if (splash) splash.remove();
          recovery.hidden = false;
          recovery.style.display = 'flex';
        }
        window.__lifewovenShowStartupRecovery = showRecovery;
        var root = document.getElementById('root');
        if (root && 'MutationObserver' in window) {
          new MutationObserver(function () {
            if (root.hasChildNodes() && recovery) {
              recovery.hidden = true;
              recovery.style.display = 'none';
            }
          }).observe(root, { childList: true });
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT' && target.type === 'module') showRecovery();
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var message = String(event.reason && (event.reason.message || event.reason));
          if (/ChunkLoadError|Failed to fetch dynamically imported module|Importing a module script failed/i.test(message)) showRecovery();
        });
        if (retry) retry.addEventListener('click', function () {
          Promise.all([
            'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function (registrations) { return Promise.all(registrations.map(function (registration) { return registration.unregister(); })); }) : Promise.resolve(),
            'caches' in window ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (key) { return caches.delete(key); })); }) : Promise.resolve(),
          ]).finally(function () { window.location.reload(); });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics: only loaded when VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID are set -->
    <script>
      (function() {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        // Vite replaces env vars at build time; if they start with '%' the var was not set
        if (!endpoint || endpoint.charAt(0) === '%' || !websiteId || websiteId.charAt(0) === '%') return;
        var s = document.createElement('script');
        s.defer = true;
        s.src = endpoint + '/umami';
        s.setAttribute('data-website-id', websiteId);
        document.head.appendChild(s);
      })();
    </script>
