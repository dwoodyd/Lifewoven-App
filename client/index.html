<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/app-icon_e26b6bab.png" />
    <link rel="apple-touch-icon" href="/manus-storage/apple-touch-icon_6ad5dd2f.png" sizes="180x180" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.lifewoven.click" />
    <meta property="og:title" content="Lifewoven — Personal Transformation Platform" />
    <meta property="og:description" content="One intelligent operating system for your whole life. Built on the 5S Framework: State, Story, Standards, Strategy, Stewardship." />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/lifewoven-og-v2-AJbQYvVtfdSvRsoCQJA4Eh.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lifewoven — Your Personal Transformation Operating System" />
    <meta property="og:site_name" content="Lifewoven" />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lifewoven — Personal Transformation Platform" />
    <meta name="twitter:description" content="One intelligent operating system for your whole life. Built on the 5S Framework: State, Story, Standards, Strategy, Stewardship." />
    <meta name="twitter:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/lifewoven-og-v2-AJbQYvVtfdSvRsoCQJA4Eh.png" />
    <meta name="twitter:image:alt" content="Lifewoven — Your Personal Transformation Operating System" />
    <title>Lifewoven — Personal Transformation Platform</title>
    <meta name="description" content="Lifewoven is a personal transformation platform built on the 5S Framework. One intelligent operating system for your whole life." />
    <!-- VitePWA injects manifest.webmanifest automatically during build -->
    <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0eb" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lifewoven" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Splash screen colors for iOS -->  
    <meta name="msapplication-TileColor" content="#1a1714" />
    <meta name="msapplication-TileImage" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/app-icon_e26b6bab.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- Anti-FOUC: apply saved theme before React mounts; default to dark -->
    <script>(function(){try{var t=localStorage.getItem('theme');var isDark=(t==='dark')||(t===null);if(isDark)document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}})()</script>
    <!-- Splash screen: spins favicon, fades out when React mounts -->
    <div id="splash" style="
      position:fixed;inset:0;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      background:var(--splash-bg,#1a1814);
      transition:opacity 0.8s ease, visibility 0.8s ease;
    ">
      <img
        src="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/kRrwoPFbyNWaiJXLmscJ4t/app-icon_e26b6bab.png"
        alt="Lifewoven"
        id="splash-icon"
        style="width:120px;height:120px;border-radius:24px;animation:lw-spin 1.2s cubic-bezier(0.4,0,0.2,1) infinite;"
      />
    </div>
    <style>
      @keyframes lw-spin {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes lw-spinoff {
        0%   { transform: rotate(0deg) scale(1); opacity: 1; }
        60%  { transform: rotate(540deg) scale(1.18); opacity: 0.7; }
        100% { transform: rotate(900deg) scale(0); opacity: 0; }
      }
    </style>
    <script>
      // Dismiss splash once React has painted its first frame
      window.__dismissSplash = function() {
        var s = document.getElementById('splash');
        var icon = document.getElementById('splash-icon');
        if (!s) return;
        // Spin-off the icon first, then fade the backdrop
        if (icon) {
          icon.style.animation = 'lw-spinoff 0.7s cubic-bezier(0.4,0,0.6,1) forwards';
        }
        setTimeout(function() {
          s.style.opacity = '0';
          s.style.visibility = 'hidden';
          setTimeout(function(){ s.remove(); }, 850);
        }, 400);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
